# Fond d'écran
background {
    monitor =
    path = screenshot   # Utilise une capture de l'écran actuel comme fond
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Champ de mot de passe
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(43, 42, 34)
    inner_color = rgb(15, 15, 7)
    font_color = rgb(230, 227, 213)
    fade_on_empty = true
    placeholder_text = <i>Mot de passe...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

# Horloge
label {
    monitor =
    text = $TIME
    color = rgba(230, 227, 213, 1.0)
    font_size = 65
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}